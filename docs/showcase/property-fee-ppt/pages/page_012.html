<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1600, initial-scale=1.0" />
  <title>风险预判与应对</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #2C2C2C;
      --bg: #F8F6F3;
      --accent: #E8E4DF;
      --text-light: #FFFFFF;
      --text-dark: #2C2C2C;
    }

    body {
      background: #e0e0e0;
      font-family: 'Noto Sans SC', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrapper {
      width: 1600px;
      height: 900px;
      position: relative;
      overflow: hidden;
      margin: 0 auto;
      background-color: var(--bg);
    }

    #bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    #ct {
      position: absolute;
      inset: 0;
      z-index: 1;
      padding: 60px 80px;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      margin-bottom: 40px;
    }

    .title {
      font-size: 56px;
      font-weight: 900;
      color: var(--primary);
      letter-spacing: 2px;
      line-height: 1.1;
    }

    /* Main Content */
    .main-content {
      display: flex;
      gap: 60px;
      flex: 1;
      min-height: 0;
    }

    /* Left Column: Risks */
    .risks-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      justify-content: center;
    }

    .risk-card {
      background: var(--primary);
      color: var(--text-light);
      padding: 20px 28px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      box-shadow: 0 12px 30px rgba(44, 44, 44, 0.08);
      transition: transform 0.3s ease;
    }

    .risk-num {
      font-size: 28px;
      font-weight: 900;
      opacity: 0.3;
      margin-right: 24px;
      font-family: Arial, sans-serif;
      width: 40px;
    }

    .risk-text {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* Right Column: Strategies & Image */
    .strategies-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .strategies-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .strategy-card {
      background: var(--text-light);
      border: 2px solid var(--accent);
      padding: 20px 28px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.03);
    }

    .strategy-dot {
      width: 12px;
      height: 12px;
      background: var(--primary);
      border-radius: 50%;
      margin-right: 24px;
      flex-shrink: 0;
    }

    .strategy-text {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-dark);
      letter-spacing: 1px;
    }

    .image-wrapper {
      flex: 1;
      background: var(--accent);
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Footer */
    .footer {
      margin-top: 30px;
      padding-top: 24px;
      border-top: 2px solid var(--accent);
    }

    .summary {
      font-size: 20px;
      font-weight: 500;
      color: #666;
      text-align: center;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div id="bg"></div>
    <div id="ct">
      
      <div class="header">
        <h1 class="title">风险预判与应对</h1>
      </div>

      <div class="main-content">
        <!-- Left: Risks -->
        <div class="risks-col">
          <div class="risk-card">
            <div class="risk-num">01</div>
            <div class="risk-text">业主抵触</div>
          </div>
          <div class="risk-card">
            <div class="risk-num">02</div>
            <div class="risk-text">表决未过</div>
          </div>
          <div class="risk-card">
            <div class="risk-num">03</div>
            <div class="risk-text">成本失控</div>
          </div>
          <div class="risk-card">
            <div class="risk-num">04</div>
            <div class="risk-text">服务滑坡</div>
          </div>
          <div class="risk-card">
            <div class="risk-num">05</div>
            <div class="risk-text">法律纠纷</div>
          </div>
        </div>

        <!-- Right: Strategies & Image -->
        <div class="strategies-col">
          <div class="strategies-list">
            <div class="strategy-card">
              <div class="strategy-dot"></div>
              <div class="strategy-text">加强宣传引导</div>
            </div>
            <div class="strategy-card">
              <div class="strategy-dot"></div>
              <div class="strategy-text">准备备选方案</div>
            </div>
            <div class="strategy-card">
              <div class="strategy-dot"></div>
              <div class="strategy-text">建立成本监控机制</div>
            </div>
            <div class="strategy-card">
              <div class="strategy-dot"></div>
              <div class="strategy-text">优化服务流程</div>
            </div>
            <div class="strategy-card">
              <div class="strategy-dot"></div>
              <div class="strategy-text">聘请法律顾问</div>
            </div>
          </div>
          
          <div class="image-wrapper">
            <img src="../images/page_012_icon2.png" alt="Risk Management Icon" />
          </div>
        </div>
      </div>

      <div class="footer">
        <p class="summary">预判风险是为了更好地规避风险，提前准备应对策略，确保方案平稳落地。</p>
      </div>

    </div>
  </div>
</body>
</html>
