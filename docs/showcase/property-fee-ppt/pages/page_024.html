<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1600, initial-scale=1.0" />
  <title>社区服务定价机制｜结束页</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #e0e0e0;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    
    .wrapper {
      position: relative;
      width: 1600px;
      height: 900px;
      margin: 0 auto;
      background: #F8F6F3;
      overflow: hidden;
      color: #2C2C2C;
    }

    /* 装饰背景层 */
    #bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    /* 内容层 */
    #ct {
      position: absolute;
      inset: 0;
      z-index: 1;
      padding: 60px 80px;
      display: flex;
      flex-direction: column;
    }

    /* 顶部标题区 */
    .header {
      text-align: center;
      margin-bottom: 40px;
      flex-shrink: 0;
    }

    .eyebrow {
      font-size: 16px;
      letter-spacing: 4px;
      color: #888;
      margin-bottom: 16px;
      font-weight: 500;
    }

    .header h1 {
      font-size: 48px;
      font-weight: 700;
      color: #2C2C2C;
      margin: 0 0 16px 0;
      letter-spacing: 2px;
    }

    .header .subtitle {
      font-size: 20px;
      color: #666;
      margin: 0;
      font-weight: 400;
    }

    /* 中部内容区 */
    .main-content {
      display: flex;
      flex: 1;
      gap: 60px;
      min-height: 0; /* 防止内容撑破 flex 容器 */
    }

    /* 左侧图片区 */
    .hero-image-wrapper {
      flex: 0 0 580px;
      background: #E8E4DF;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(100%) contrast(1.1);
    }

    /* 右侧文本区 */
    .right-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 32px;
    }

    .info-block {
      padding-left: 24px;
      border-left: 3px solid #2C2C2C;
    }

    .info-block h3 {
      font-size: 22px;
      font-weight: 700;
      color: #2C2C2C;
      margin: 0 0 12px 0;
      letter-spacing: 1px;
    }

    .info-block ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .info-block li {
      font-size: 18px;
      color: #555;
      margin-bottom: 8px;
      position: relative;
      padding-left: 20px;
      line-height: 1.5;
    }

    .info-block li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      width: 6px;
      height: 6px;
      background: #2C2C2C;
      border-radius: 50%;
    }

    .info-block p {
      font-size: 18px;
      color: #555;
      line-height: 1.6;
      margin: 0;
    }

    /* 底部叙事区 */
    .footer {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid #D0CCC5;
      text-align: center;
      flex-shrink: 0;
    }

    .footer p {
      font-size: 20px;
      color: #444;
      margin: 0;
      line-height: 1.6;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div id="bg"></div>
    <div id="ct">
      
      <!-- 顶部标题 -->
      <div class="header">
        <div class="eyebrow">社区服务定价机制</div>
        <h1>共建美好家园</h1>
        <p class="subtitle">携手物业委员会，开启社区服务新篇章</p>
      </div>

      <!-- 中部内容 -->
      <div class="main-content">
        <!-- 左侧图片 -->
        <div class="hero-image-wrapper">
          <img src="../images/page_024_hero.png" alt="温馨社区全景黑白图" />
        </div>

        <!-- 右侧文本 -->
        <div class="right-column">
          <div class="info-block">
            <h3>核心承诺</h3>
            <ul>
              <li>质价相符</li>
              <li>透明公开</li>
              <li>服务至上</li>
            </ul>
          </div>

          <div class="info-block">
            <h3>行动纲领</h3>
            <ul>
              <li>分级定价</li>
              <li>服务升级</li>
              <li>财务透明</li>
            </ul>
          </div>

          <div class="info-block">
            <h3>愿景目标</h3>
            <p>打造安全、舒适、和谐的现代化社区</p>
          </div>
        </div>
      </div>

      <!-- 底部叙事 -->
      <div class="footer">
        <p>定价调整不是终点，而是服务升级的起点。让我们携手共进，为业主创造更美好的居住体验。</p>
      </div>

    </div>
  </div>
</body>
</html>
