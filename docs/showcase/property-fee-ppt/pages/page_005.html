<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1600, initial-scale=1.0" />
  <title>成本构成详解</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');

    :root {
      --bg-color: #E8E4DF;
      --dark-bg: #2C2C2C;
      --card-bg: #FFFFFF;
      --text-main: #2C2C2C;
      --text-sub: #666666;
      --accent-color: #D4CFC8;
      --white: #F8F6F3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #cccccc;
      font-family: 'Noto Sans SC', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrapper {
      position: relative;
      width: 1600px;
      height: 900px;
      margin: 0 auto;
      background: var(--bg-color);
      overflow: hidden;
      color: var(--text-main);
    }

    /* 装饰背景层 */
    #bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: radial-gradient(circle at 80% 20%, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 50%);
    }

    /* 内容层 */
    #ct {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
    }

    /* 顶部 Header */
    .header {
      height: 140px;
      background: var(--dark-bg);
      padding: 0 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-left h1 {
      font-size: 42px;
      color: var(--white);
      font-weight: 700;
      letter-spacing: 2px;
      margin: 0;
    }

    .header-left p {
      font-size: 18px;
      color: var(--accent-color);
      font-weight: 300;
      letter-spacing: 1px;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .tag {
      padding: 6px 16px;
      border: 1px solid var(--accent-color);
      border-radius: 20px;
      color: var(--white);
      font-size: 14px;
      letter-spacing: 1px;
    }

    .note {
      font-size: 14px;
      color: var(--white);
      opacity: 0.8;
      max-width: 400px;
      text-align: right;
      line-height: 1.5;
    }

    /* 主体内容区 */
    .main-content {
      flex: 1;
      padding: 40px 60px;
      display: flex;
      gap: 40px;
      align-items: center;
    }

    /* 左侧图表 */
    .chart-section {
      flex: 0 0 560px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .chart-title {
      align-self: flex-start;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chart-title::before {
      content: '';
      display: block;
      width: 6px;
      height: 24px;
      background: var(--text-main);
      border-radius: 3px;
    }

    .chart-container {
      width: 100%;
      height: 380px;
      position: relative;
    }

    /* 右侧 KPI 卡片 */
    .kpi-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .kpi-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 28px 32px;
      display: flex;
      align-items: center;
      gap: 30px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.02);
      transition: transform 0.3s ease;
    }

    .kpi-card.highlight {
      background: #FDFDFD;
      border: 1px solid #E0DCD5;
    }

    .kpi-left {
      flex: 0 0 140px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .kpi-label {
      font-size: 18px;
      color: var(--text-sub);
      font-weight: 500;
    }

    .kpi-value {
      font-size: 56px;
      font-weight: 900;
      color: var(--text-main);
      line-height: 1;
      font-family: 'Noto Sans SC', sans-serif;
    }

    .kpi-value span {
      font-size: 24px;
      font-weight: 500;
      margin-left: 4px;
      color: var(--text-sub);
    }

    .kpi-right {
      flex: 1;
      border-left: 1px solid var(--accent-color);
      padding-left: 30px;
    }

    .kpi-desc {
      font-size: 16px;
      color: var(--text-sub);
      line-height: 1.6;
      margin-bottom: 12px;
    }

    .kpi-tags {
      display: flex;
      gap: 10px;
    }

    .mini-tag {
      background: var(--bg-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
    }

    /* 底部总结 */
    .footer {
      height: 80px;
      padding: 0 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(0,0,0,0.05);
    }

    .summary-text {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .summary-text::before {
      content: '';
      display: inline-block;
      width: 24px;
      height: 24px;
      background: var(--dark-bg);
      border-radius: 50%;
    }

    .footer-meta {
      font-size: 14px;
      color: var(--text-sub);
    }

  </style>
</head>
<body>
  <div class="wrapper">
    <div id="bg"></div>
    
    <div id="ct">
      <!-- 顶部 -->
      <div class="header">
        <div class="header-left">
          <h1>成本构成详解</h1>
          <p>透明成本拆解建立信任，每项支出对应具体服务</p>
        </div>
        <div class="header-right">
          <div class="tag">数据展示页</div>
          <div class="note">核心目标：清晰呈现各项成本占比及对应服务产出</div>
        </div>
      </div>

      <!-- 主体 -->
      <div class="main-content">
        <!-- 左侧图表 -->
        <div class="chart-section">
          <div class="chart-title">成本占比分布</div>
          <div class="chart-container" id="chart_1"></div>
        </div>

        <!-- 右侧 KPI -->
        <div class="kpi-section">
          <!-- Card 1 -->
          <div class="kpi-card highlight">
            <div class="kpi-left">
              <div class="kpi-label">人力成本</div>
              <div class="kpi-value">45<span>%</span></div>
            </div>
            <div class="kpi-right">
              <div class="kpi-desc">最大支出项，覆盖安保、保洁、客服及工程运维等核心岗位配置。</div>
              <div class="kpi-tags">
                <span class="mini-tag">最大支出项</span>
                <span class="mini-tag">服务核心</span>
              </div>
            </div>
          </div>

          <!-- Card 2 -->
          <div class="kpi-card">
            <div class="kpi-left">
              <div class="kpi-label">维护成本</div>
              <div class="kpi-value">20<span>%</span></div>
            </div>
            <div class="kpi-right">
              <div class="kpi-desc">保障设施设备正常运转，包含日常维修、设备保养及备件更换。</div>
              <div class="kpi-tags">
                <span class="mini-tag">设施寿命保障</span>
              </div>
            </div>
          </div>

          <!-- Card 3 -->
          <div class="kpi-card">
            <div class="kpi-left">
              <div class="kpi-label">能耗成本</div>
              <div class="kpi-value">15<span>%</span></div>
            </div>
            <div class="kpi-right">
              <div class="kpi-desc">公共区域水电及空调照明能耗，通过节能改造持续优化空间。</div>
              <div class="kpi-tags">
                <span class="mini-tag">节能改造空间</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 底部 -->
      <div class="footer">
        <div class="summary-text">成本透明化 = 服务可信化</div>
        <div class="footer-meta">数据来源：年度运营预算报告 | 单位：百分比</div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
  <script>
    (function() {
      const chartDom = document.getElementById('chart_1');
      const chart = echarts.init(chartDom, null, {renderer: 'svg'});
      
      const option = {
        color: ['#2C2C2C', '#666666', '#999999', '#CCCCCC', '#E6E6E6'],
        tooltip: {
          trigger: 'item',
          formatter: '{b} : {c}%'
        },
        legend: {
          orient: 'vertical',
          right: '5%',
          top: 'center',
          textStyle: {
            color: '#666666',
            fontSize: 14
          },
          itemWidth: 10,
          itemHeight: 10,
          itemGap: 20
        },
        series: [
          {
            name: '成本构成',
            type: 'pie',
            radius: ['50%', '75%'],
            center: ['40%', '50%'],
            avoidLabelOverlap: false,
            itemStyle: {
              borderRadius: 8,
              borderColor: '#FFFFFF',
              borderWidth: 4
            },
            label: {
              show: false,
              position: 'center'
            },
            emphasis: {
              label: {
                show: true,
                fontSize: '24',
                fontWeight: 'bold',
                color: '#2C2C2C',
                formatter: '{b}\n{c}%'
              }
            },
            labelLine: {
              show: false
            },
            data: [
              { value: 45, name: '人力成本' },
              { value: 20, name: '维护成本' },
              { value: 15, name: '能耗成本' },
              { value: 10, name: '绿化清洁' },
              { value: 10, name: '管理分摊' }
            ]
          }
        ]
      };

      chart.setOption(option);
      window.__pptxChartsReady = (window.__pptxChartsReady || 0) + 1;
    })();
  </script>
</body>
</html>
