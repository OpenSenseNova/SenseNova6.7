<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1600, initial-scale=1.0" />
  <title>现有服务痛点</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

    :root {
      --bg-color: #F8F6F3;
      --text-main: #2C2C2C;
      --text-sub: #666666;
      --accent: #E8E4DF;
      --card-bg: #FFFFFF;
      --border-color: #EAE6E1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #e0e0e0;
      font-family: 'Noto Sans SC', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrapper {
      position: relative;
      width: 1600px;
      height: 900px;
      margin: 0 auto;
      background: var(--bg-color);
      overflow: hidden;
      color: var(--text-main);
    }

    #bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: var(--bg-color);
    }

    #ct {
      position: absolute;
      inset: 0;
      z-index: 1;
      padding: 60px 80px;
      display: flex;
      flex-direction: column;
    }

    /* Header Section */
    .header {
      margin-bottom: 30px;
      position: relative;
      z-index: 2;
    }

    .eyebrow {
      display: inline-block;
      font-size: 14px;
      font-weight: 500;
      color: #888;
      letter-spacing: 2px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .header h1 {
      font-size: 40px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 12px;
      color: var(--text-main);
      letter-spacing: 1px;
    }

    .header .subtitle {
      font-size: 16px;
      color: var(--text-sub);
      line-height: 1.6;
      max-width: 800px;
    }

    /* Main Content Area */
    .main-content {
      display: flex;
      gap: 40px;
      flex: 1;
      min-height: 0;
    }

    /* Left Column: Pain Points */
    .left-col {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .pain-points-grid {
      display: flex;
      gap: 16px;
      flex: 1;
      align-items: stretch;
    }

    .point-card {
      flex: 1;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0,0,0,0.02);
      transition: transform 0.3s ease;
    }

    .icon-box {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .icon-box svg {
      width: 24px;
      height: 24px;
      stroke: var(--text-main);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .point-card h3 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .point-card p {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-sub);
      margin-bottom: 20px;
    }

    .highlight {
      font-weight: 700;
      color: var(--text-main);
      background: linear-gradient(transparent 60%, var(--accent) 60%);
      padding: 0 2px;
      display: inline-block;
      line-height: 1.4;
    }

    /* Right Column: Image */
    .right-col {
      width: 40%;
      background: var(--card-bg);
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03);
      border: 1px solid var(--border-color);
    }

    .hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Footer */
    .footer {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
      font-size: 14px;
      color: #888;
      letter-spacing: 0.5px;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div id="bg"></div>
    <div id="ct">
      
      <div class="header">
        <div class="eyebrow">SERVICE REVIEW</div>
        <h1>现有服务痛点</h1>
        <p class="subtitle">直面问题，转化改进重点以增强业主信心</p>
      </div>

      <div class="main-content">
        <div class="left-col">
          <div class="pain-points-grid">
            <!-- Point 1 -->
            <div class="point-card">
              <div class="icon-box">
                <svg viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="8"></circle>
                  <path d="M12 8v5l3 2"></path>
                </svg>
              </div>
              <h3>响应速度</h3>
              <p>报修及投诉流程需<span class="highlight">优化</span>，缩短等待时间。</p>
            </div>

            <!-- Point 2 -->
            <div class="point-card">
              <div class="icon-box">
                <svg viewBox="0 0 24 24">
                  <path d="M14.7 13.3L16 12l-4-4-1.3 1.3"></path>
                  <path d="M9 15l-3 3 1.5 1.5 3-3"></path>
                  <path d="M11 13l4 4"></path>
                </svg>
              </div>
              <h3>设施老化</h3>
              <p>维护频率与业主预期<span class="highlight">不符</span>，需提升感知。</p>
            </div>

            <!-- Point 3 -->
            <div class="point-card">
              <div class="icon-box">
                <svg viewBox="0 0 24 24">
                  <path d="M12 20c4-4 6-7 6-10a3 3 0 0 0-6 0c0-2-1-3-3-3-3 0-3 4-3 7 0 3 2 5 6 6z"></path>
                </svg>
              </div>
              <h3>绿化养护</h3>
              <p>季节性标准需<span class="highlight">细化公示</span>，增强直观感受。</p>
            </div>

            <!-- Point 4 -->
            <div class="point-card">
              <div class="icon-box">
                <svg viewBox="0 0 24 24">
                  <path d="M12 3l7 4v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V7l7-4z"></path>
                  <path d="M9.5 12l1.8 1.8L15 10.2"></path>
                </svg>
              </div>
              <h3>安保巡逻</h3>
              <p>夜间频次与监控覆盖<span class="highlight">待加强</span>，提升安全感。</p>
            </div>

            <!-- Point 5 -->
            <div class="point-card">
              <div class="icon-box">
                <svg viewBox="0 0 24 24">
                  <path d="M7 18c2.5-2.5 4-5 5-8 1 3 2.5 5.5 5 8"></path>
                  <path d="M9 18h6"></path>
                  <path d="M10 21h4"></path>
                </svg>
              </div>
              <h3>环境卫生</h3>
              <p>清洁标准需<span class="highlight">量化评估</span>，避免死角遗漏。</p>
            </div>
          </div>
        </div>

        <div class="right-col">
          <img src="../images/page_004_hero.png" alt="服务场景可视化" class="hero-img">
        </div>
      </div>

      <div class="footer">
        将服务短板转化为定价调整后的改进重点
      </div>
      
    </div>
  </div>
</body>
</html>
