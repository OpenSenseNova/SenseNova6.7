<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1600, initial-scale=1.0" />
  <title>服务量化指标</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');

    :root {
      --bg-color: #F8F6F3;
      --text-main: #2C2C2C;
      --text-sub: #666666;
      --accent-color: #2C2C2C;
      --border-color: #E8E4DF;
      --card-bg: #FFFFFF;
    }

    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      background: #e0e0e0;
      font-family: "Noto Sans SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrapper {
      position: relative;
      width: 1600px;
      height: 900px;
      margin: 0 auto;
      background: var(--bg-color);
      overflow: hidden;
      color: var(--text-main);
    }

    #bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: radial-gradient(circle at 50% 0%, #ffffff 0%, var(--bg-color) 80%);
    }

    #ct {
      position: absolute;
      inset: 0;
      z-index: 1;
      padding: 60px 80px;
      display: flex;
      flex-direction: column;
    }

    /* 装饰线条 */
    .deco-line-top {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: var(--accent-color);
    }

    .deco-line-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: var(--border-color);
    }

    /* 顶部标题区 */
    .header {
      text-align: center;
      margin-bottom: 40px;
      position: relative;
    }

    .header::before {
      content: "";
      display: block;
      width: 60px;
      height: 4px;
      background: var(--accent-color);
      margin: 0 auto 20px;
    }

    .header h1 {
      margin: 0 0 16px 0;
      font-size: 48px;
      line-height: 1.2;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--text-main);
    }

    .header h2 {
      margin: 0;
      font-size: 20px;
      line-height: 1.5;
      font-weight: 400;
      color: var(--text-sub);
    }

    /* 核心指标区 */
    .metrics-container {
      display: flex;
      justify-content: space-between;
      gap: 40px;
      margin-bottom: 50px;
      flex: 1;
    }

    .metric-card {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.02);
      position: relative;
      overflow: hidden;
    }

    .metric-card::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: var(--accent-color);
    }

    /* 仪表盘样式 */
    .gauge-wrapper {
      position: relative;
      width: 160px;
      height: 160px;
      margin-bottom: 30px;
    }

    .gauge {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
    }

    /* 响应时间：30/60 = 50% */
    .gauge-1 {
      background: conic-gradient(var(--accent-color) 50%, var(--border-color) 0);
    }
    /* 修复周期：24/48 = 50% (假设标准48h) */
    .gauge-2 {
      background: conic-gradient(var(--accent-color) 50%, var(--border-color) 0);
    }
    /* 满意度：90/100 = 90% */
    .gauge-3 {
      background: conic-gradient(var(--accent-color) 90%, var(--border-color) 0);
    }

    .gauge::before {
      content: "";
      position: absolute;
      inset: 16px;
      background: var(--card-bg);
      border-radius: 50%;
      border: 1px solid var(--border-color);
    }

    .gauge-value {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    .gauge-value .num {
      font-size: 48px;
      font-weight: 900;
      color: var(--text-main);
      line-height: 1;
      margin-bottom: 4px;
    }

    .gauge-value .unit {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-sub);
    }

    .metric-info {
      text-align: center;
    }

    .metric-info .label {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .metric-info .sub-label {
      font-size: 16px;
      color: var(--text-sub);
    }

    /* 服务要点区 */
    .features-section {
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 30px 40px;
      margin-bottom: 30px;
    }

    .features-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
    }

    .features-title::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 18px;
      background: var(--accent-color);
      margin-right: 10px;
      border-radius: 2px;
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
    }

    .feature-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .feature-item .f-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .feature-item .f-desc {
      font-size: 14px;
      color: var(--text-sub);
      line-height: 1.5;
    }

    /* 底部总结 */
    .footer {
      text-align: center;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
    }

    .footer p {
      margin: 0;
      font-size: 16px;
      font-weight: 500;
      color: var(--text-sub);
      letter-spacing: 1px;
    }

  </style>
</head>
<body>
  <div class="wrapper">
    <div id="bg"></div>
    <div id="ct">
      <div class="deco-line-top"></div>
      <div class="deco-line-bottom"></div>

      <!-- 顶部标题区 -->
      <div class="header">
        <h1>服务量化指标</h1>
        <h2>将服务承诺量化为可考核的指标，让业主看得见、摸得着，增强信任感</h2>
      </div>

      <!-- 核心指标区 -->
      <div class="metrics-container">
        <!-- 卡片 1 -->
        <div class="metric-card">
          <div class="gauge-wrapper">
            <div class="gauge gauge-1">
              <div class="gauge-value">
                <div class="num">30</div>
                <div class="unit">分钟</div>
              </div>
            </div>
          </div>
          <div class="metric-info">
            <div class="label">响应时间</div>
            <div class="sub-label">快速响应机制</div>
          </div>
        </div>

        <!-- 卡片 2 -->
        <div class="metric-card">
          <div class="gauge-wrapper">
            <div class="gauge gauge-2">
              <div class="gauge-value">
                <div class="num">24</div>
                <div class="unit">小时</div>
              </div>
            </div>
          </div>
          <div class="metric-info">
            <div class="label">修复周期</div>
            <div class="sub-label">一般故障标准</div>
          </div>
        </div>

        <!-- 卡片 3 -->
        <div class="metric-card">
          <div class="gauge-wrapper">
            <div class="gauge gauge-3">
              <div class="gauge-value">
                <div class="num">90%</div>
                <div class="unit">年度目标</div>
              </div>
            </div>
          </div>
          <div class="metric-info">
            <div class="label">满意度</div>
            <div class="sub-label">服务体验达标</div>
          </div>
        </div>
      </div>

      <!-- 服务要点区 -->
      <div class="features-section">
        <div class="features-title">关键服务承诺</div>
        <div class="features-grid">
          <div class="feature-item">
            <div class="f-title">报修响应</div>
            <div class="f-desc">30分钟响应 / 24小时修复</div>
          </div>
          <div class="feature-item">
            <div class="f-title">清洁频次</div>
            <div class="f-desc">每日2次清扫 / 垃圾日产日清</div>
          </div>
          <div class="feature-item">
            <div class="f-title">绿化存活</div>
            <div class="f-desc">95%存活率 / 定期修剪</div>
          </div>
          <div class="feature-item">
            <div class="f-title">满意度目标</div>
            <div class="f-desc">90%以上 / 持续跟踪</div>
          </div>
          <div class="feature-item">
            <div class="f-title">投诉处理</div>
            <div class="f-desc">100%处理率与回访率</div>
          </div>
        </div>
      </div>

      <!-- 底部总结 -->
      <div class="footer">
        <p>数据透明，服务可感</p>
      </div>

    </div>
  </div>
</body>
</html>
