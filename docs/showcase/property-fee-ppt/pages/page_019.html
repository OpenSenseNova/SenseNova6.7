<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1600, initial-scale=1.0" />
  <title>财务透明与监督 - 过渡页</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@100;300;400;500;700;900&display=swap');

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #E8E4DF;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrapper {
      position: relative;
      width: 1600px;
      height: 900px;
      margin: 0 auto;
      background: #F8F6F3;
      overflow: hidden;
      color: #2C2C2C;
    }

    /* 装饰背景层 */
    .bg-decor {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .grid-line-h {
      position: absolute;
      left: 80px; right: 80px;
      height: 1px;
      background: rgba(44, 44, 44, 0.06);
    }
    .grid-line-v {
      position: absolute;
      top: 80px; bottom: 80px;
      width: 1px;
      background: rgba(44, 44, 44, 0.06);
    }

    /* 内容层 */
    .content-layer {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 60px 100px;
    }

    /* 顶部区域 */
    .header-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 40px;
    }
    .section-no {
      font-size: 14px;
      letter-spacing: 6px;
      color: #888;
      font-weight: 500;
      margin-bottom: 16px;
      position: relative;
    }
    .section-no::before, .section-no::after {
      content: "";
      display: inline-block;
      width: 20px;
      height: 1px;
      background: #888;
      vertical-align: middle;
      margin: 0 12px;
    }
    .main-title {
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #111;
      margin: 0 0 20px 0;
      line-height: 1.1;
    }
    .sub-title {
      font-size: 20px;
      font-weight: 300;
      color: #555;
      letter-spacing: 2px;
      margin: 0;
    }

    /* 核心图形装饰 */
    .center-graphic {
      width: 100%;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 30px;
    }
    .ledger-lines {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .ll-line {
      width: 24px;
      height: 16px;
      border: 1.5px solid #2C2C2C;
      background: transparent;
    }
    .ll-line.active {
      background: #2C2C2C;
    }
    .ll-dot {
      width: 4px;
      height: 4px;
      background: #2C2C2C;
      border-radius: 50%;
    }

    /* 五栏布局区域 */
    .columns-section {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-grow: 1;
      padding: 0 40px;
    }
    .col {
      width: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .col-divider {
      width: 1px;
      height: 100%;
      background: rgba(44, 44, 44, 0.15);
      position: relative;
    }
    .col-divider::before, .col-divider::after {
      content: "";
      position: absolute;
      left: -2px;
      width: 5px;
      height: 5px;
      background: #2C2C2C;
      border-radius: 50%;
    }
    .col-divider::before { top: 0; }
    .col-divider::after { bottom: 0; }

    .col-num {
      font-size: 13px;
      font-weight: 700;
      color: #888;
      margin-bottom: 16px;
      letter-spacing: 1px;
      font-family: Arial, sans-serif;
    }
    .col-title {
      font-size: 22px;
      font-weight: 700;
      color: #111;
      margin: 0 0 16px 0;
      letter-spacing: 1px;
    }
    .col-text {
      font-size: 14px;
      line-height: 1.8;
      color: #555;
      font-weight: 300;
      margin: 0;
    }

    /* 底部区域 */
    .footer-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }
    .footer-line {
      width: 40px;
      height: 2px;
      background: #2C2C2C;
      margin-bottom: 20px;
    }
    .footer-text {
      font-size: 16px;
      font-weight: 400;
      color: #444;
      letter-spacing: 1px;
      text-align: center;
      max-width: 800px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="wrapper canvas">
    <!-- 装饰背景层 -->
    <div class="bg-decor">
      <div class="grid-line-h" style="top: 80px;"></div>
      <div class="grid-line-h" style="bottom: 80px;"></div>
      <div class="grid-line-v" style="left: 80px;"></div>
      <div class="grid-line-v" style="right: 80px;"></div>
    </div>

    <!-- 内容层 -->
    <div class="content-layer">
      
      <!-- 头部 -->
      <div class="header-section" data-region="header">
        <div class="section-no">SECTION 04</div>
        <h1 class="main-title">财务透明与监督</h1>
        <p class="sub-title">建立信任，让每一笔收支都清晰可见</p>
      </div>

      <!-- 中间抽象图形 -->
      <div class="center-graphic" data-region="center-graphic">
        <div class="ledger-lines">
          <div class="ll-line"></div>
          <div class="ll-line active"></div>
          <div class="ll-line"></div>
          <div class="ll-dot"></div>
          <div class="ll-line active"></div>
          <div class="ll-line"></div>
          <div class="ll-line active"></div>
        </div>
      </div>

      <!-- 五栏并列 -->
      <div class="columns-section">
        <div class="col" data-region="column-1">
          <div class="col-num">01</div>
          <h3 class="col-title">收支公示</h3>
          <p class="col-text">定期在公告栏及 APP<br>公示物业收支明细</p>
        </div>
        
        <div class="col-divider"></div>
        
        <div class="col" data-region="column-2">
          <div class="col-num">02</div>
          <h3 class="col-title">第三方审计</h3>
          <p class="col-text">年度聘请第三方机构<br>进行财务审计</p>
        </div>
        
        <div class="col-divider"></div>
        
        <div class="col" data-region="column-3">
          <div class="col-num">03</div>
          <h3 class="col-title">公共收益</h3>
          <p class="col-text">电梯广告及公共车位收益<br>单独列账，按比例分配</p>
        </div>
        
        <div class="col-divider"></div>
        
        <div class="col" data-region="column-4">
          <div class="col-num">04</div>
          <h3 class="col-title">业主监督</h3>
          <p class="col-text">成立业主监督小组<br>可随时查阅相关账目</p>
        </div>
        
        <div class="col-divider"></div>
        
        <div class="col" data-region="column-5">
          <div class="col-num">05</div>
          <h3 class="col-title">合规备案</h3>
          <p class="col-text">所有财务数据按要求<br>向主管部门备案</p>
        </div>
      </div>

      <!-- 底部收束 -->
      <div class="footer-section" data-region="footer-note">
        <div class="footer-line"></div>
        <div class="footer-text">财务透明是建立长期信任的核心，通过制度化、规范化的监督机制，消除业主疑虑</div>
      </div>

    </div>
  </div>
</body>
</html>
