<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1600, initial-scale=1.0" />
  <title>分级定价方案 - 章节过渡页</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

    * { box-sizing: border-box; }
    
    :root {
      --bg-color: #F8F6F3;
      --text-dark: #2C2C2C;
      --text-light: #7A7570;
      --accent-color: #E8E4DF;
      --card-bg: #FFFFFF;
      --card-shadow: 0 10px 30px rgba(44, 44, 44, 0.04);
    }

    body {
      margin: 0;
      background: #333;
      font-family: "Noto Sans SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrapper {
      position: relative;
      width: 1600px;
      height: 900px;
      margin: 0 auto;
      background: var(--bg-color);
      overflow: hidden;
      color: var(--text-dark);
    }

    /* 背景层 */
    #bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: radial-gradient(circle at 100% 0%, #EAE5DF 0%, transparent 50%),
                  radial-gradient(circle at 0% 100%, #EBE8E3 0%, transparent 50%);
    }

    /* 内容层 */
    #ct {
      position: absolute;
      inset: 0;
      z-index: 1;
      padding: 60px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 顶部区域 */
    .header {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 40px;
    }

    .top-tag {
      display: inline-block;
      padding: 6px 18px;
      background: var(--text-dark);
      color: #FFFFFF;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 2px;
      margin-bottom: 24px;
    }

    .title-wrap {
      width: 100%;
      max-width: 1200px;
    }

    .title-wrap h1 {
      margin: 0;
      font-size: 56px;
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--text-dark);
    }

    .title-wrap .subtitle {
      margin: 16px 0 0 0;
      font-size: 22px;
      line-height: 1.5;
      color: var(--text-light);
      font-weight: 400;
      letter-spacing: 1px;
    }

    .top-divider {
      width: 100%;
      height: 1px;
      background: var(--accent-color);
      margin-top: 32px;
    }

    /* 中部双栏对比区域 */
    .content-area {
      display: flex;
      gap: 40px;
      flex: 1;
      min-height: 0;
    }

    .column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .col-title {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 4px;
      padding-left: 8px;
    }

    .col-title .dot {
      width: 8px;
      height: 8px;
      background: var(--text-dark);
      border-radius: 50%;
    }

    .col-title span {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-dark);
      letter-spacing: 1px;
    }

    .col-title .line {
      flex: 1;
      height: 1px;
      background: var(--accent-color);
    }

    .card {
      flex: 1;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px 32px;
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(232, 228, 223, 0.5);
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: transform 0.3s ease;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 12px;
    }

    .card .num {
      font-size: 36px;
      font-weight: 700;
      color: var(--accent-color);
      line-height: 1;
      font-family: Arial, sans-serif;
    }

    .card h2 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      color: var(--text-dark);
      letter-spacing: 1px;
    }

    .card p {
      margin: 0;
      font-size: 16px;
      line-height: 1.6;
      color: var(--text-light);
      padding-left: 56px; /* 对齐标题文字 */
    }

    /* 底部叙事句 */
    .footer {
      margin-top: 32px;
      padding: 24px 40px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 16px;
      border: 1px solid rgba(232, 228, 223, 0.8);
      text-align: center;
    }

    .footer p {
      margin: 0;
      font-size: 18px;
      line-height: 1.6;
      color: var(--text-dark);
      font-weight: 500;
      letter-spacing: 1px;
    }

    .footer .highlight {
      color: #A68A61;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div id="bg"></div>
    <div id="ct">
      
      <!-- 顶部标题区 -->
      <div class="header">
        <div class="top-tag">章节过渡</div>
        <div class="title-wrap">
          <h1>第二部分：分级定价方案</h1>
          <p class="subtitle">基础保障与个性化需求的平衡之道</p>
        </div>
        <div class="top-divider"></div>
      </div>

      <!-- 中部双栏内容区 -->
      <div class="content-area">
        
        <!-- 左栏 -->
        <div class="column left-col">
          <div class="col-title">
            <div class="dot"></div>
            <span>基础服务包</span>
            <div class="line"></div>
          </div>
          
          <div class="card">
            <div class="card-header">
              <div class="num">01</div>
              <h2>基础服务包</h2>
            </div>
            <p>聚焦安保清洁与设施维护，确保园区日常运转的标准化与稳定性。</p>
          </div>

          <div class="card">
            <div class="card-header">
              <div class="num">02</div>
              <h2>增值服务包</h2>
            </div>
            <p>涵盖家政代收及专属管家，满足业主多样化的个性化生活需求。</p>
          </div>
        </div>

        <!-- 右栏 -->
        <div class="column right-col">
          <div class="col-title">
            <div class="dot"></div>
            <span>定价与机制</span>
            <div class="line"></div>
          </div>

          <div class="card">
            <div class="card-header">
              <div class="num">03</div>
              <h2>差异化定价</h2>
            </div>
            <p>基于楼栋位置与户型面积，设计更公平合理的阶梯式价格体系。</p>
          </div>

          <div class="card">
            <div class="card-header">
              <div class="num">04</div>
              <h2>优惠机制</h2>
            </div>
            <p>明确预缴政策与群体关怀，通过激励机制提升业主的缴费意愿。</p>
          </div>

          <div class="card">
            <div class="card-header">
              <div class="num">05</div>
              <h2>透明公示</h2>
            </div>
            <p>坚持服务清单与价格明细同步公开，建立长期可持续的信任关系。</p>
          </div>
        </div>

      </div>

      <!-- 底部收束区 -->
      <div class="footer">
        <p>分级定价不是简单的涨价，<span class="highlight">而是给予业主更多选择权</span>，让每一分钱都花在刀刃上。</p>
      </div>

    </div>
  </div>
</body>
</html>
