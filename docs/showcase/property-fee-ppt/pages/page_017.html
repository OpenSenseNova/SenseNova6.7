<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1600, initial-scale=1.0" />
  <title>数字化赋能</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

    * { box-sizing: border-box; }
    
    :root {
      --bg-color: #F8F6F3;
      --card-bg: #FFFFFF;
      --text-main: #1A1A1A;
      --text-sub: #666666;
      --accent-gray: #E8E4DF;
      --border-color: #EAE5DF;
      --shadow-soft: 0 12px 36px rgba(0, 0, 0, 0.03);
    }

    body {
      margin: 0;
      background: #e0e0e0;
      font-family: 'Noto Sans SC', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrapper {
      position: relative;
      width: 1600px;
      height: 900px;
      margin: 0 auto;
      background-color: var(--bg-color);
      overflow: hidden;
    }

    #bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    #ct {
      position: absolute;
      inset: 0;
      z-index: 1;
      padding: 60px 80px;
      display: flex;
      flex-direction: column;
    }

    /* Header Section */
    .header {
      margin-bottom: 40px;
      flex-shrink: 0;
    }

    .tags {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .tag {
      padding: 6px 16px;
      background: var(--accent-gray);
      color: var(--text-main);
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .title {
      margin: 0 0 16px 0;
      font-size: 48px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 2px;
    }

    .subtitle {
      margin: 0;
      font-size: 18px;
      line-height: 1.6;
      color: var(--text-sub);
      max-width: 900px;
    }

    /* Main Content Layout */
    .main-content {
      display: flex;
      gap: 40px;
      flex: 1;
      min-height: 0;
    }

    /* Left Column: Modules */
    .modules-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 24px;
    }

    .module-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      transition: transform 0.3s ease;
    }

    .module-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    .icon-box {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #F5F3F0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-box svg {
      width: 24px;
      height: 24px;
      stroke: var(--text-main);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .module-title {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
    }

    .module-desc {
      margin: 0;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-sub);
    }

    /* Right Column: Image */
    .image-column {
      width: 40%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-image-container {
      width: 100%;
      aspect-ratio: 9/16;
      background: var(--accent-gray);
      border-radius: 32px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.06);
    }

    .hero-image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Bottom Section */
    .footer {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .footer-text {
      margin: 0;
      font-size: 16px;
      color: var(--text-sub);
      font-weight: 500;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div id="bg"></div>
    <div id="ct">
      
      <!-- Header -->
      <div class="header">
        <div class="tags">
          <span class="tag">数字化赋能</span>
          <span class="tag">智慧园区</span>
        </div>
        <h1 class="title">数字化赋能</h1>
        <p class="subtitle">数字化不仅是效率工具，更是连接物业与业主的桥梁，让服务更便捷、更透明。</p>
      </div>

      <!-- Main Content -->
      <div class="main-content">
        
        <!-- Left: Modules Grid -->
        <div class="modules-grid">
          
          <div class="module-card">
            <div class="module-header">
              <div class="icon-box">
                <svg viewBox="0 0 24 24">
                  <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                  <line x1="12" y1="18" x2="12.01" y2="18"></line>
                </svg>
              </div>
              <h2 class="module-title">APP 服务</h2>
            </div>
            <p class="module-desc">集成报修、缴费、投诉及社区公告，业主需求一键直达。</p>
          </div>

          <div class="module-card">
            <div class="module-header">
              <div class="icon-box">
                <svg viewBox="0 0 24 24">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </div>
              <h2 class="module-title">智能门禁</h2>
            </div>
            <p class="module-desc">手机远程开门及访客邀请，提升通行效率与安全保障。</p>
          </div>

          <div class="module-card">
            <div class="module-header">
              <div class="icon-box">
                <svg viewBox="0 0 24 24">
                  <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                  <line x1="1" y1="10" x2="23" y2="10"></line>
                </svg>
              </div>
              <h2 class="module-title">在线缴费</h2>
            </div>
            <p class="module-desc">支持多种支付方式与电子发票，账单清晰，缴费无忧。</p>
          </div>

          <div class="module-card">
            <div class="module-header">
              <div class="icon-box">
                <svg viewBox="0 0 24 24">
                  <line x1="18" y1="20" x2="18" y2="10"></line>
                  <line x1="12" y1="20" x2="12" y2="4"></line>
                  <line x1="6" y1="20" x2="6" y2="14"></line>
                </svg>
              </div>
              <h2 class="module-title">数据看板</h2>
            </div>
            <p class="module-desc">物业数据可视化监控，工单响应与设备状态实时掌握。</p>
          </div>

          <div class="module-card">
            <div class="module-header">
              <div class="icon-box">
                <svg viewBox="0 0 24 24">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                  <circle cx="9" cy="7" r="4"></circle>
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
              </div>
              <h2 class="module-title">业主互动</h2>
            </div>
            <p class="module-desc">社区论坛与活动报名，促进邻里交流，共建活力社区。</p>
          </div>

        </div>

        <!-- Right: Hero Image -->
        <div class="image-column">
          <div class="hero-image-container">
            <img src="../images/page_017_hero.png" alt="数字化赋能手机界面模拟图" />
          </div>
        </div>

      </div>

      <!-- Footer -->
      <div class="footer">
        <p class="footer-text">服务更便捷 &nbsp;·&nbsp; 管理更透明 &nbsp;·&nbsp; 邻里更互动</p>
      </div>

    </div>
  </div>
</body>
</html>
