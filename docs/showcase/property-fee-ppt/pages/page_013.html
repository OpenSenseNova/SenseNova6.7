<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1600, initial-scale=1.0" />
  <title>服务提升承诺 - 过渡页</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');

    :root {
      --c-primary: #2C2C2C;
      --c-bg: #F8F6F3;
      --c-card: #FFFFFF;
      --c-border: #E8E4DF;
      --c-text-main: #2C2C2C;
      --c-text-sub: #666666;
      --c-accent: #D4CFC8;
      --font-main: 'Noto Sans SC', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: #e0e0e0;
      font-family: var(--font-main);
      -webkit-font-smoothing: antialiased;
    }

    .wrapper {
      position: relative;
      width: 1600px;
      height: 900px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--c-bg);
    }

    #bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: radial-gradient(circle at 50% 0%, #ffffff 0%, var(--c-bg) 80%);
    }

    /* 装饰性背景元素 - 柔和光晕 */
    .deco-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.6;
    }
    .blob-1 {
      width: 600px; height: 600px;
      background: #ebe7e0;
      top: -150px; left: -150px;
    }
    .blob-2 {
      width: 700px; height: 700px;
      background: #f0ece5;
      bottom: -200px; right: -100px;
    }

    #ct {
      position: absolute;
      inset: 0;
      z-index: 1;
      padding: 60px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 顶部区域 */
    .header-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 10px;
      position: relative;
      z-index: 2;
    }

    .chapter-tag {
      display: inline-block;
      padding: 8px 28px;
      background: var(--c-primary);
      color: #fff;
      border-radius: 30px;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 2px;
      margin-bottom: 24px;
      box-shadow: 0 8px 20px rgba(44,44,44,0.15);
    }

    .title-wrap h1 {
      font-size: 64px;
      line-height: 1.1;
      font-weight: 900;
      color: var(--c-text-main);
      letter-spacing: 2px;
      margin-bottom: 16px;
    }

    .title-wrap .subtitle {
      font-size: 20px;
      color: var(--c-text-sub);
      font-weight: 400;
      letter-spacing: 1px;
      max-width: 800px;
    }

    /* 中间卡片区域 */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 24px;
      margin: auto 0;
      position: relative;
      z-index: 2;
    }

    .card {
      background: var(--c-card);
      border: 1px solid var(--c-border);
      border-radius: 24px;
      padding: 36px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0,0,0,0.03);
      transition: transform 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 6px;
      background: var(--c-primary);
      opacity: 0.8;
    }

    .icon-box {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: var(--c-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      border: 1px solid var(--c-border);
    }

    .icon-box svg {
      width: 32px;
      height: 32px;
      stroke: var(--c-primary);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .card h3 {
      font-size: 22px;
      font-weight: 700;
      color: var(--c-text-main);
      margin-bottom: 12px;
    }

    .card p {
      font-size: 15px;
      line-height: 1.6;
      color: var(--c-text-sub);
    }

    /* 底部叙事区域 */
    .footer-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 2;
      margin-bottom: 10px;
    }

    .footer-line {
      width: 40px;
      height: 3px;
      background: var(--c-accent);
      margin-bottom: 24px;
      border-radius: 2px;
    }

    .narrative-text {
      font-size: 20px;
      line-height: 1.6;
      color: var(--c-text-main);
      font-weight: 500;
      text-align: center;
      max-width: 900px;
      background: rgba(255,255,255,0.6);
      padding: 24px 48px;
      border-radius: 20px;
      border: 1px solid rgba(232,228,223,0.8);
      box-shadow: 0 8px 24px rgba(0,0,0,0.02);
    }

    .narrative-text .highlight {
      color: #B85C38; /* 暖色调强调 */
      font-weight: 700;
    }

  </style>
</head>
<body>
  <div class="wrapper">
    <div id="bg">
      <div class="deco-blob blob-1"></div>
      <div class="deco-blob blob-2"></div>
    </div>

    <div id="ct">
      
      <!-- 顶部标题 -->
      <div class="header-section">
        <div class="chapter-tag">PART 03</div>
        <div class="title-wrap">
          <h1>服务提升承诺</h1>
          <div class="subtitle">价格调整后的服务升级路线图</div>
        </div>
      </div>

      <!-- 核心承诺卡片 -->
      <div class="cards-grid">
        <!-- 卡片 1 -->
        <div class="card">
          <div class="icon-box">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
          </div>
          <h3>人员优化</h3>
          <p>增加关键岗位配置<br>提升响应效率</p>
        </div>

        <!-- 卡片 2 -->
        <div class="card">
          <div class="icon-box">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
              <line x1="9" y1="9" x2="15" y2="9"></line>
              <line x1="9" y1="13" x2="15" y2="13"></line>
              <line x1="9" y1="17" x2="12" y2="17"></line>
            </svg>
          </div>
          <h3>设备更新</h3>
          <p>专项资金升级设施<br>保障运行稳定</p>
        </div>

        <!-- 卡片 3 -->
        <div class="card">
          <div class="icon-box">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              <path d="M9 12l2 2 4-4"></path>
            </svg>
          </div>
          <h3>环境美化</h3>
          <p>绿化与文化宣传栏<br>营造温馨社区</p>
        </div>

        <!-- 卡片 4 -->
        <div class="card">
          <div class="icon-box">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
          </div>
          <h3>数字化建设</h3>
          <p>智能物业系统<br>让服务触手可及</p>
        </div>

        <!-- 卡片 5 -->
        <div class="card">
          <div class="icon-box">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
          </div>
          <h3>满意度考核</h3>
          <p>季度调查与绩效挂钩<br>接受业主监督</p>
        </div>
      </div>

      <!-- 底部总结 -->
      <div class="footer-section">
        <div class="footer-line"></div>
        <div class="narrative-text">
          涨价必须伴随<span class="highlight">服务升级</span>，这是物业公司的核心承诺，也是赢得业主支持的关键。
        </div>
      </div>

    </div>
  </div>
</body>
</html>
