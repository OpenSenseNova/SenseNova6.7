<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1600, initial-scale=1.0" />
  <title>财务监督体系</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');

    :root {
      --bg-color: #F8F6F3;
      --text-main: #2C2C2C;
      --text-sub: #555555;
      --accent: #E8E4DF;
      --card-bg: #FFFFFF;
      --border-light: #EAE6E1;
    }

    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      background: #e0e0e0;
      font-family: "Noto Sans SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrapper {
      position: relative;
      width: 1600px;
      height: 900px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--bg-color);
      color: var(--text-main);
    }

    #bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    #ct {
      position: absolute;
      inset: 0;
      z-index: 1;
      padding: 60px 80px;
      display: flex;
      flex-direction: column;
    }

    /* Top Section */
    .top-section {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 40px;
    }

    .title-area {
      max-width: 700px;
    }

    .title-area h1 {
      margin: 0 0 16px 0;
      font-size: 46px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-main);
    }

    .title-area .subtitle {
      margin: 0;
      font-size: 18px;
      line-height: 1.6;
      color: var(--text-sub);
    }

    .image-area {
      width: 480px;
      height: 270px;
      border-radius: 24px;
      overflow: hidden;
      background: var(--accent);
      box-shadow: 0 12px 30px rgba(44, 44, 44, 0.06);
      flex-shrink: 0;
    }

    .image-area img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Cards Section */
    .cards-section {
      display: flex;
      gap: 20px;
      flex: 1;
      margin-bottom: 40px;
    }

    .card {
      flex: 1;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 32px 24px;
      border: 1px solid var(--border-light);
      box-shadow: 0 8px 24px rgba(44, 44, 44, 0.03);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
    }

    .icon-box {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--bg-color);
      border: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .icon-box svg {
      width: 24px;
      height: 24px;
      stroke: var(--text-main);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .card h3 {
      margin: 0 0 12px 0;
      font-size: 20px;
      line-height: 1.3;
      font-weight: 700;
      color: var(--text-main);
    }

    .card p {
      margin: 0;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-sub);
    }

    /* Footer */
    .footer {
      text-align: center;
      padding-top: 24px;
      border-top: 1px solid var(--border-light);
    }

    .footer p {
      margin: 0;
      font-size: 16px;
      font-weight: 500;
      color: var(--text-main);
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div id="bg"></div>
    <div id="ct">
      
      <div class="top-section">
        <div class="title-area">
          <h1>财务监督体系</h1>
          <p class="subtitle">构建内外部结合的监督体系，确保财务数据的真实性与合规性，让业主放心。</p>
        </div>
        <div class="image-area">
          <img src="../images/page_021_hero.png" alt="财务监督体系示意图">
        </div>
      </div>

      <div class="cards-section">
        <div class="card">
          <div class="icon-box">
            <svg viewBox="0 0 24 24">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              <path d="M9 12l2 2 4-4"></path>
            </svg>
          </div>
          <h3>内部风控</h3>
          <p>建立严格的审批流程与报销制度，从源头规范资金使用。</p>
        </div>

        <div class="card">
          <div class="icon-box">
            <svg viewBox="0 0 24 24">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
          </div>
          <h3>外部审计</h3>
          <p>年度聘请专业会计师事务所审计，以第三方视角保障客观公正。</p>
        </div>

        <div class="card">
          <div class="icon-box">
            <svg viewBox="0 0 24 24">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
          </div>
          <h3>业主监督</h3>
          <p>业主代表参与财务检查与账目核对，让每一笔支出透明可查。</p>
        </div>

        <div class="card">
          <div class="icon-box">
            <svg viewBox="0 0 24 24">
              <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
              <line x1="4" y1="22" x2="4" y2="15"></line>
            </svg>
          </div>
          <h3>政府备案</h3>
          <p>主动向街道及物价部门备案财务数据，接受行政指导与监督。</p>
        </div>

        <div class="card">
          <div class="icon-box">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
          </div>
          <h3>违规追责</h3>
          <p>发现违规行为严肃追责，形成有效的约束机制与闭环管理。</p>
        </div>
      </div>

      <div class="footer">
        <p>数据真实 · 流程合规 · 业主安心</p>
      </div>

    </div>
  </div>
</body>
</html>
