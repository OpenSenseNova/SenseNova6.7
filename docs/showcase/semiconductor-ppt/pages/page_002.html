

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1600, initial-scale=1.0" />
  <title>市场全景 - 章节过渡页</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Serif+SC:wght@400;700&family=Inter:wght@300;400;600&display=swap');

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #111214;
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrapper {
      position: relative;
      width: 1600px;
      height: 900px;
      margin: 0 auto;
      overflow: hidden;
      background: #1A1C20;
      color: #F4F1EA;
    }

    #bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    #ct {
      position: absolute;
      inset: 0;
      z-index: 1;
      padding: 60px 80px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* --- Left Column (Image & Graphic) --- */
    .left-col {
      width: 600px;
      height: 740px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-end;
      padding-right: 60px;
    }

    .divider-graphic {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    .hero-img {
      width: 540px;
      height: 302px;
      object-fit: cover;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      margin-bottom: 40px;
      border-radius: 2px;
    }

    .img-caption {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: #78909C;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: right;
      margin-bottom: 40px;
    }

    .left-bottom-decor {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: flex-end;
      opacity: 0.8;
    }

    .gold-line {
      width: 120px;
      height: 1px;
      background: #C9A961;
    }

    .red-block {
      width: 160px;
      height: 16px;
      background: #E53935;
    }

    /* --- Right Column (Text & Data) --- */
    .right-col {
      width: 760px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 50px;
    }

    .top-section {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .chapter-no {
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: #E53935;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .main-title {
      font-family: 'Playfair Display', 'Noto Serif SC', serif;
      font-size: 64px;
      line-height: 1.1;
      font-weight: 700;
      color: #F4F1EA;
      margin: 0;
      letter-spacing: 1px;
    }

    .sub-title {
      font-family: 'Inter', sans-serif;
      font-size: 20px;
      line-height: 1.6;
      color: #78909C;
      margin: 0;
      max-width: 680px;
    }

    .narrative-section {
      padding-top: 30px;
      border-top: 1px solid rgba(201, 169, 97, 0.2);
    }

    .narrative-text {
      font-family: 'Inter', sans-serif;
      font-size: 18px;
      line-height: 1.8;
      color: #D1D5DB;
      margin: 0;
    }

    .narrative-text strong {
      color: #F4F1EA;
      font-weight: 600;
    }

    .narrative-text .highlight-red {
      color: #E53935;
      font-weight: 600;
    }

    .metrics-section {
      display: flex;
      gap: 20px;
      align-items: stretch;
    }

    .metric-card {
      flex: 1;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .metric-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 4px; height: 100%;
      background: #C9A961;
    }

    .metric-card.red-accent::before {
      background: #E53935;
    }

    .metric-value {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      font-weight: 700;
      color: #F4F1EA;
      margin-bottom: 12px;
      line-height: 1;
    }

    .metric-value span {
      font-family: 'Inter', sans-serif;
      font-size: 20px;
      margin-left: 2px;
    }

    .metric-value .up { color: #E53935; }
    .metric-value .down { color: #C9A961; }

    .metric-label {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: #78909C;
      line-height: 1.5;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .metric-sub {
      font-size: 12px;
      color: #9CA3AF;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div id="bg">
      <svg class="divider-graphic" viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
        <!-- 极简杂志风格的分割设计 -->
        <polygon points="0,0 350,0 0,900" fill="#E53935" opacity="0.95"/>
        <polygon points="350,0 450,0 0,900" fill="#C9A961" opacity="0.15"/>
        <line x1="0" y1="200" x2="350" y2="200" stroke="#C9A961" stroke-width="1" opacity="0.6"/>
        <line x1="0" y1="600" x2="200" y2="600" stroke="#C9A961" stroke-width="1" opacity="0.4"/>
      </svg>
    </div>

    <div id="ct">
      <!-- 左侧视觉区 -->
      <div class="left-col">
        <div class="img-caption">Market Panorama / Divider Composition</div>
        <img src="../images/page_002_divider.png" alt="市场全景分割设计图" class="hero-img" />
        
        <div class="left-bottom-decor">
          <div class="gold-line"></div>
          <div class="red-block"></div>
        </div>
      </div>

      <!-- 右侧内容区 -->
      <div class="right-col">
        <div class="top-section">
          <div class="chapter-no">PART 01</div>
          <h1 class="main-title">市场全景</h1>
          <p class="sub-title">2026 Q1-Q2 价格数据解读与整体走势</p>
        </div>

        <div class="narrative-section">
          <p class="narrative-text">
            市场进入<strong>极度分化</strong>阶段：移动端与 AI 存储需求持续强劲，而传统 PC 渠道因需求疲软出现价格回调。
          </p>
        </div>

        <div class="metrics-section">
          <div class="metric-card red-accent">
            <div class="metric-value"><span class="up">+32.22%</span></div>
            <div class="metric-label">Mobile 涨幅<br><span class="metric-sub">22 种产品全线上涨</span></div>
          </div>
          
          <div class="metric-card">
            <div class="metric-value"><span class="up">+25.33%</span></div>
            <div class="metric-label">移动存储涨幅<br><span class="metric-sub">MicroSD 领涨</span></div>
          </div>
          
          <div class="metric-card red-accent">
            <div class="metric-value"><span class="down">-16.00%</span></div>
            <div class="metric-label">PC 跌幅<br><span class="metric-sub">DDR4 UDIMM 8GB 3200</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
