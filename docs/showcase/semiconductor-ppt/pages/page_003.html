

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1600, initial-scale=1.0" />
  <title>整体市场走势统计</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap');

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #ece8e1;
      font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper {
      position: relative;
      width: 1600px;
      height: 900px;
      margin: 0 auto;
      background: #F7F5F0;
      overflow: hidden;
      color: #1A1A1A;
    }

    #bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    #ct {
      position: absolute;
      inset: 0;
      z-index: 1;
      padding: 60px;
      display: flex;
      flex-direction: column;
    }

    .header-area {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 40px;
      flex-shrink: 0;
    }

    .title-wrap {
      flex: 1;
      max-width: 800px;
    }

    .eyebrow {
      display: inline-block;
      padding: 6px 14px;
      background: #E53935;
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 20px;
      border-radius: 2px;
    }

    h1 {
      margin: 0;
      font-family: "Noto Serif SC", "Times New Roman", serif;
      font-size: 48px;
      line-height: 1.2;
      font-weight: 900;
      color: #1A1A1A;
      letter-spacing: 1px;
    }

    .page-no {
      font-family: "Noto Serif SC", "Times New Roman", serif;
      font-size: 18px;
      color: #C9A961;
      font-weight: 700;
      letter-spacing: 1px;
      margin-top: 10px;
    }

    .main-content {
      display: flex;
      gap: 60px;
      flex: 1;
      min-height: 0;
    }

    .left-col {
      width: 800px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }

    .image-frame {
      width: 100%;
      height: 396px;
      background: #FFFFFF;
      border: 1px solid #E0E0E0;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03);
    }

    .image-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .caption {
      margin-top: 16px;
      font-size: 15px;
      color: #666;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .caption::before {
      content: "";
      display: block;
      width: 4px;
      height: 14px;
      background: #E53935;
    }

    .right-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding-top: 10px;
    }

    .section-label {
      font-size: 13px;
      color: #C9A961;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    .kpi-card {
      background: #FFFFFF;
      border-left: 6px solid #E53935;
      padding: 24px 30px;
      margin-bottom: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.02);
    }

    .kpi-title {
      font-size: 14px;
      color: #888;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    .kpi-grid {
      display: flex;
      gap: 40px;
    }

    .kpi-item {
      flex: 1;
    }

    .kpi-value {
      font-family: "Noto Serif SC", "Times New Roman", serif;
      font-size: 42px;
      font-weight: 900;
      color: #E53935;
      line-height: 1;
      margin-bottom: 8px;
    }

    .kpi-desc {
      font-size: 14px;
      color: #555;
      line-height: 1.5;
    }

    .table-card {
      background: #FFFFFF;
      border: 1px solid #E0E0E0;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .table-card table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .table-card th {
      background: #F5F5F5;
      color: #333;
      font-weight: 700;
      padding: 16px 24px;
      font-size: 15px;
      border-bottom: 2px solid #E0E0E0;
    }

    .table-card td {
      padding: 16px 24px;
      font-size: 15px;
      color: #333;
      border-bottom: 1px solid #F0F0F0;
    }

    .table-card tr:last-child td {
      border-bottom: none;
    }

    .table-card .highlight {
      color: #E53935;
      font-weight: 700;
      font-size: 16px;
    }

    .insight-box {
      background: #1A1A1A;
      padding: 24px 30px;
      color: #FFFFFF;
      border-left: 6px solid #C9A961;
    }

    .insight-title {
      font-size: 13px;
      color: #C9A961;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .insight-text {
      font-size: 16px;
      line-height: 1.7;
      color: #E0E0E0;
    }

    .footer-note {
      margin-top: auto;
      font-size: 13px;
      color: #999;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div id="bg"></div>
    <div id="ct">
      
      <div class="header-area">
        <div class="title-wrap">
          <div class="eyebrow">市场走势</div>
          <h1>整体市场走势统计</h1>
        </div>
        <div class="page-no">03 / 数据页</div>
      </div>

      <div class="main-content">
        <div class="left-col">
          <div class="image-frame">
            <img src="../images/page_003_inherited.png" alt="各类产品价格变动柱状对比图" />
          </div>
          <div class="caption">图：各类产品价格变动（柱状对比）</div>
        </div>

        <div class="right-col">
          <div class="section-label">核心数据与结论</div>
          
          <div class="kpi-card">
            <div class="kpi-title">总记录数 / 覆盖范围</div>
            <div class="kpi-grid">
              <div class="kpi-item">
                <div class="kpi-value">1835</div>
                <div class="kpi-desc">条有效记录<br>支撑本期走势判断</div>
              </div>
              <div class="kpi-item">
                <div class="kpi-value">5<span style="font-size:20px; color:#E53935; margin-left:4px;">类</span></div>
                <div class="kpi-desc">覆盖 5 大品类<br>细分至 15 个子类</div>
              </div>
            </div>
          </div>

          <div class="table-card">
            <table>
              <thead>
                <tr>
                  <th style="width: 40%;">统计项</th>
                  <th style="width: 30%;">数值</th>
                  <th style="width: 30%;">占比</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>价格上涨产品</td>
                  <td class="highlight">66 种</td>
                  <td class="highlight">85.7%</td>
                </tr>
                <tr>
                  <td>价格持平产品</td>
                  <td>11 种</td>
                  <td>14.3%</td>
                </tr>
                <tr>
                  <td>价格下跌产品</td>
                  <td>6 种</td>
                  <td>7.8%</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="insight-box">
            <div class="insight-title">叙事说明</div>
            <div class="insight-text">
              渠道数据验证了行业机构对 DRAM 和 NAND 涨价的预测，但渠道市场存在滞后效应，实际涨幅低于合约价预测。
            </div>
          </div>
        </div>
      </div>

      <div class="footer-note">
        注：图表与表格为本期统计口径下的汇总表达，用于支撑“价格上涨为主、涨幅分化”的核心结论。
      </div>

    </div>
  </div>
</body>
</html>
