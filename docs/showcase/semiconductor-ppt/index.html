<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>半导体存储市场研究报告 · 16 页</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; background: #0e0e10; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; color: #eee; }
  #frame { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  #bar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; align-items: center; padding: 8px 16px; background: rgba(20,20,22,0.85); backdrop-filter: blur(8px); border-radius: 999px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); user-select: none; z-index: 10; }
  #bar button { background: #2a2a2e; color: #eee; border: 1px solid #3a3a3e; border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
  #bar button:hover:not(:disabled) { background: #3a3a3e; }
  #bar button:disabled { opacity: 0.4; cursor: not-allowed; }
  #counter { font-size: 13px; color: #bbb; min-width: 60px; text-align: center; font-variant-numeric: tabular-nums; }
  #jump { width: 50px; background: #1a1a1e; color: #eee; border: 1px solid #3a3a3e; border-radius: 6px; padding: 4px 6px; font-size: 13px; text-align: center; }
  #title { position: fixed; top: 16px; left: 16px; font-size: 13px; color: #aaa; padding: 6px 12px; background: rgba(20,20,22,0.85); backdrop-filter: blur(8px); border-radius: 6px; z-index: 10; }
</style>
</head>
<body>
<div id="title">半导体存储市场研究报告</div>
<iframe id="frame" src="pages/page_001.html"></iframe>
<div id="bar">
  <button id="prev">← 上一页</button>
  <span id="counter">1 / 16</span>
  <button id="next">下一页 →</button>
  <input id="jump" type="number" min="1" max="16" value="1" />
</div>
<script>
  const TOTAL = 16;
  const frame = document.getElementById('frame');
  const counter = document.getElementById('counter');
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  const jump = document.getElementById('jump');
  let cur = 1;

  function pad(n) { return String(n).padStart(3, '0'); }
  function go(n) {
    n = Math.max(1, Math.min(TOTAL, n));
    cur = n;
    frame.src = 'pages/page_' + pad(n) + '.html';
    counter.textContent = n + ' / ' + TOTAL;
    jump.value = n;
    prev.disabled = (n === 1);
    next.disabled = (n === TOTAL);
    if (location.hash !== '#' + n) history.replaceState(null, '', '#' + n);
  }
  prev.onclick = () => go(cur - 1);
  next.onclick = () => go(cur + 1);
  jump.onchange = () => go(parseInt(jump.value, 10) || 1);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(cur - 1);
    else if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') go(cur + 1);
  });
  const initial = parseInt((location.hash || '#1').slice(1), 10) || 1;
  go(initial);
</script>
</body>
</html>
